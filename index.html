<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Ship It Show with Adela｜收聽連結</title>
<meta name="theme-color" content="#FAF3EB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF3EB; --card:#FFFBF4; --ink:#4A3426; --ink-soft:#7A6555;
    --yellow:#F6C343; --hl:#FBDA72; --blue:#C7E1E8;
    --hand:"Kalam","LXGW WenKai TC",cursive;
    --zh-hand:"LXGW WenKai TC","Kalam",cursive;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Noto Sans TC",system-ui,sans-serif; line-height:1.6;
    min-height:100vh; display:flex; justify-content:center; overflow-x:hidden;
    background-image:
      radial-gradient(420px 300px at 92% 4%, rgba(199,225,232,.55), transparent 70%),
      radial-gradient(380px 280px at 0% 62%, rgba(251,218,114,.30), transparent 70%);
  }
  main{width:100%; max-width:480px; padding:28px 20px 56px}

  /* header */
  header{text-align:center}
  .logo{width:220px; height:220px; display:block; margin:0 auto; mix-blend-mode:multiply}
  .bio{font-family:var(--zh-hand); font-size:16.5px; margin:6px 6px 0; color:var(--ink)}
  .bio .mark{background:linear-gradient(transparent 55%, var(--hl) 55%, var(--hl) 92%, transparent 92%); padding:0 2px}
  .tagline{font-family:var(--hand); color:var(--ink); font-size:19px; margin-top:4px}
  .tagline .mark{background:linear-gradient(transparent 55%, var(--hl) 55%, var(--hl) 92%, transparent 92%); padding:0 2px}

  .label{
    font-family:var(--zh-hand); font-weight:700; font-size:18px; margin:30px 2px 12px;
    display:flex; align-items:center; gap:10px;
  }
  .label::after{content:""; flex:1; border-top:2px dashed rgba(74,52,38,.35)}
  .label .spark{color:var(--yellow); font-family:var(--hand); font-size:20px; line-height:1}

  /* hand-drawn card */
  .card{
    background:var(--card); border:2.5px solid var(--ink);
    border-radius:22px 18px 24px 16px / 16px 24px 18px 22px;
    box-shadow:4px 5px 0 rgba(74,52,38,.85);
  }

  /* latest episode */
  .latest{overflow:hidden}
  .latest .cover{display:block; width:100%; aspect-ratio:1; object-fit:cover; border-bottom:2.5px solid var(--ink)}
  .latest .body{padding:16px 18px 18px}
  .ep-tag{
    display:inline-block; font-family:var(--hand); font-weight:700; font-size:15px;
    border:2px solid var(--ink); border-radius:50% / 60%; padding:0 12px; line-height:1.7;
  }
  .new{font-family:var(--hand); color:#C0612B; font-size:15px; margin-left:8px}
  .latest h2{font-family:var(--zh-hand); font-weight:700; font-size:20px; line-height:1.45; margin:10px 0 8px}
  .latest p{font-size:14.5px; color:var(--ink-soft)}
  .latest .next{margin-top:10px; font-size:14px; color:var(--ink)}
  .latest .next b{background:var(--hl); padding:1px 6px; border-radius:4px; font-weight:500; margin-right:4px}
  .ep-links{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap}
  .pill{
    display:inline-flex; align-items:center; gap:6px; text-decoration:none; color:var(--ink);
    border:2px solid var(--ink); border-radius:99px; padding:5px 13px 5px 8px;
    font-size:13.5px; font-weight:500; background:#fff; transition:transform .12s, background .12s;
  }
  a.pill:hover{background:var(--hl); transform:translateY(-1px)}
  .pill svg{width:18px; height:18px}
  .pill.off{opacity:.4}

  /* platform links */
  .links{display:flex; flex-direction:column; gap:14px}
  .link{
    display:flex; align-items:center; gap:14px; text-decoration:none; color:var(--ink);
    padding:12px 16px; font-weight:500; font-size:16px;
    transition:transform .12s, box-shadow .12s, background .12s;
  }
  .links .link:nth-child(even){border-radius:18px 24px 16px 22px / 22px 16px 24px 18px}
  a.link:hover{transform:translate(-1px,-2px); box-shadow:5px 7px 0 rgba(74,52,38,.85); background:#FFF6DC}
  .ico{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; flex:none; border:2px solid var(--ink)}
  .ico svg{width:20px; height:20px; fill:#fff}
  .link .name{flex:1}
  .link .sub{display:block; font-size:12.5px; color:var(--ink-soft); font-weight:400}
  .link .go{font-family:var(--hand); font-size:22px; line-height:1}
  .link.soon{opacity:.5; cursor:default}
  .link.soon .go{font-family:var(--zh-hand); font-size:13px; border:1.5px dashed var(--ink); padding:0 8px; border-radius:99px}

  /* past episodes */
  .past{display:flex; flex-direction:column; gap:12px}
  .past a, .past div.item{display:flex; gap:12px; align-items:center; text-decoration:none; color:var(--ink); padding:10px}
  .past img{width:64px; height:64px; border-radius:12px; border:2px solid var(--ink); object-fit:cover; flex:none}
  .past .t{font-size:14px; line-height:1.45}
  .past .t b{font-family:var(--hand); font-size:14px; display:block}

  .share{
    margin:30px auto 0; display:block; font-family:var(--zh-hand); font-size:15.5px; color:var(--ink); cursor:pointer;
    background:var(--hl); border:2.5px solid var(--ink); border-radius:99px; padding:9px 22px;
    box-shadow:3px 4px 0 rgba(74,52,38,.85); transition:transform .12s;
  }
  .share:hover{transform:translateY(-1px)}
  footer{text-align:center; font-family:var(--hand); color:var(--ink-soft); font-size:16px; margin-top:24px}
  footer .plane{display:inline-block; transform:rotate(-20deg)}
</style>
</head>
<body>
<main>
  <header>
    <img class="logo" src="assets/logo.jpg" alt="The Ship It Show with Adela">
    <p class="tagline">Finding the <span class="mark">Aha</span> Behind Every Product.</p>
  </header>

  <div class="label"><span class="spark">✶</span>最新一集</div>
  <article class="card latest" id="latest"></article>

  <div class="label"><span class="spark">✶</span>訂閱收聽</div>
  <div class="links" id="listen"></div>

  <div class="label"><span class="spark">✶</span>追蹤 Adela</div>
  <div class="links" id="social"></div>

  <section id="past-wrap" hidden>
    <div class="label"><span class="spark">✶</span>往期節目</div>
    <div class="past" id="past"></div>
  </section>

  <button class="share" id="share" type="button">複製這個頁面的連結</button>
  <footer>keep shipping <span class="plane">✈</span></footer>
</main>

<script>
/* ===== 節目層級的連結：留空 "" 會顯示「即將上線」 ===== */
const SHOW = {
  spotify: "",
  apple:   "",
  youtube: "",
  instagram: "",
  threads: "",
  linkedin: "https://www.linkedin.com/in/adelawen",
};
/* 每一集的資料在 episodes.json（最新的一集放最上面） */

const ICONS = {
  linkedin:'<svg viewBox="0 0 24 24"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9.75h4v11.25H3V9.75Zm6.5 0h3.8v1.6h.06c.53-1 1.83-2.05 3.77-2.05 4.03 0 4.77 2.65 4.77 6.1V21h-4v-4.95c0-1.18-.02-2.7-1.65-2.7-1.65 0-1.9 1.29-1.9 2.62V21h-3.85V9.75Z"/></svg>',
  spotify:'<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm4.6 14.4a.6.6 0 0 1-.9.2c-2.4-1.5-5.4-1.8-9-1a.6.6 0 1 1-.3-1.2c3.9-.9 7.2-.5 9.9 1.1.3.2.4.6.3.9Zm1.2-2.7a.8.8 0 0 1-1 .3c-2.7-1.7-6.9-2.2-10.2-1.2a.8.8 0 1 1-.4-1.5c3.7-1.1 8.4-.6 11.4 1.3.4.2.5.7.2 1.1Zm.1-2.8C14.7 9 9.4 8.8 6.3 9.7a.9.9 0 1 1-.5-1.8c3.5-1 9.4-.8 13.1 1.4a.9.9 0 0 1-1 1.6Z"/></svg>',
  apple:'<svg viewBox="0 0 24 24"><path d="M12 2a8 8 0 0 0-3.2 15.3l.3-1.6A6.5 6.5 0 1 1 18.5 10a6.4 6.4 0 0 1-3.6 5.8l.3 1.6A8 8 0 0 0 12 2Zm0 3.2a4.8 4.8 0 0 0-2.4 9l.3-1.7a3.2 3.2 0 1 1 4.2 0l.3 1.7a4.8 4.8 0 0 0-2.4-9ZM12 8.6a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 0 0 0-3.2Zm-1.3 4.6c-.6 0-1 .5-.9 1.1l.8 6.4c.1.7.6 1.3 1.4 1.3s1.3-.6 1.4-1.3l.8-6.4c.1-.6-.3-1.1-.9-1.1h-2.6Z"/></svg>',
  youtube:'<svg viewBox="0 0 24 24"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8ZM9.7 15V9l5.8 3-5.8 3Z"/></svg>',
  instagram:'<svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0 8.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4ZM17.3 5.5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4ZM12 2c-2.7 0-3 0-4.1.1C4.3 2.2 2.3 4.2 2.1 7.9 2 9 2 9.3 2 12s0 3 .1 4.1c.2 3.6 2.2 5.6 5.8 5.8 1.1.1 1.4.1 4.1.1s3 0 4.1-.1c3.6-.2 5.6-2.2 5.8-5.8.1-1.1.1-1.4.1-4.1s0-3-.1-4.1c-.2-3.6-2.2-5.6-5.8-5.8C15 2 14.7 2 12 2Z"/></svg>',
  threads:'<svg viewBox="0 0 24 24"><path d="M17 11.2c-.1 0-.2-.1-.3-.1-.2-3-1.8-4.7-4.6-4.7-1.6 0-3 .7-3.9 2l1.5 1c.6-1 1.6-1.2 2.4-1.2 1 0 1.7.3 2.2.9.3.4.6 1 .6 1.7-.8-.1-1.6-.2-2.5-.1-2.5.1-4.100 1.6-4 3.6.1 1 .6 1.9 1.4 2.4.7.5 1.6.7 2.5.6 1.2-.1 2.2-.5 2.8-1.4.5-.6.8-1.5.9-2.5.6.4 1 .9 1.3 1.4.4 1 .4 2.6-.9 3.9-1.2 1.2-2.6 1.700-4.7 1.7-2.4 0-4.2-.8-5.3-2.3-1.1-1.4-1.6-3.4-1.6-6s.5-4.6 1.6-6c1.2-1.5 3-2.2 5.3-2.3 2.4 0 4.2.8 5.4 2.3.6.7 1 1.6 1.3 2.7l1.8-.5c-.3-1.300-.9-2.4-1.6-3.4-1.5-1.9-3.8-2.9-6.8-2.9-3 0-5.3 1-6.8 2.9C3.6 7.1 3 9.4 3 12.2c0 2.9.7 5.2 2 6.9 1.5 1.9 3.8 2.9 6.8 2.9 2.6 0 4.5-.7 6-2.2 2-2 2-4.5 1.3-6-.4-1.1-1.2-2-2.1-2.6Zm-4.4 4.2c-1 .1-2.1-.4-2.1-1.4 0-.8.6-1.6 2.4-1.7h.6c.6 0 1.2.1 1.7.2-.2 2.4-1.4 2.8-2.6 2.9Z"/></svg>',
};
const META = {
  linkedin:{name:"LinkedIn", color:"#0A66C2", sub:"Adela Wen"},
  spotify:{name:"Spotify", color:"#1DB954"},
  apple:{name:"Apple Podcasts", color:"#9B4DCA"},
  youtube:{name:"YouTube", color:"#E5322D", sub:"完整影音版"},
  instagram:{name:"Instagram", color:"#D9467A", sub:"短影音 Reels・限動提問"},
  threads:{name:"Threads", color:"#2B2B2B", sub:"想聽誰的 Aha？來這裡聊"},
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderLinks(id, keys){
  document.getElementById(id).innerHTML = keys.map(k => {
    const m = META[k], url = SHOW[k];
    const inner = `<span class="ico" style="background:${m.color}">${ICONS[k]}</span>
      <span class="name">${m.name}${m.sub ? `<span class="sub">${m.sub}</span>` : ""}</span>`;
    return url
      ? `<a class="card link" href="${esc(url)}" target="_blank" rel="noopener">${inner}<span class="go">→</span></a>`
      : `<div class="card link soon">${inner}<span class="go">即將上線</span></div>`;
  }).join("");
}
renderLinks("listen", ["spotify","apple","youtube"]);
renderLinks("social", ["instagram","threads","linkedin"]);

function epLink(ep, k){ return (ep.links && ep.links[k]) || SHOW[k] || ""; }

function renderLatest(ep){
  const pills = ["spotify","apple","youtube"].map(k => {
    const url = epLink(ep, k), m = META[k];
    const icon = ICONS[k].replace('<svg', `<svg style="fill:${m.color}"`);
    return url
      ? `<a class="pill" href="${esc(url)}" target="_blank" rel="noopener">${icon}${m.name}</a>`
      : `<span class="pill off">${icon}${m.name}</span>`;
  }).join("");
  document.getElementById("latest").innerHTML = `
    <img class="cover" src="${esc(ep.cover)}" alt="${esc(ep.id)} 封面">
    <div class="body">
      <span class="ep-tag">${esc(ep.id)}</span><span class="new">new!</span>
      <h2>${esc(ep.title)}</h2>
      <p>${esc(ep.summary)}</p>
      ${ep.next ? `<p class="next"><b>下集預告</b>${esc(ep.next.replace(/^下集預告[:：]\s*/,""))}</p>` : ""}
      <div class="ep-links">${pills}</div>
    </div>`;
}

function renderPast(list){
  if (!list.length) return;
  document.getElementById("past-wrap").hidden = false;
  document.getElementById("past").innerHTML = list.map(ep => {
    const url = epLink(ep, "spotify") || epLink(ep, "youtube") || epLink(ep, "apple");
    const inner = `<img src="${esc(ep.cover)}" alt=""><span class="t"><b>${esc(ep.id)}</b>${esc(ep.title)}</span>`;
    return url ? `<a class="card" href="${esc(url)}" target="_blank" rel="noopener">${inner}</a>`
               : `<div class="card item">${inner}</div>`;
  }).join("");
}

fetch("episodes.json", {cache:"no-store"})
  .then(r => r.json())
  .then(eps => { if (eps.length){ renderLatest(eps[0]); renderPast(eps.slice(1)); } })
  .catch(() => { document.getElementById("latest").innerHTML = '<div class="body"><p>最新一集載入中，請稍後重新整理。</p></div>'; });

const btn = document.getElementById("share");
btn.addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(location.href); btn.textContent = "已複製 ✓"; }
  catch { btn.textContent = location.href; }
  setTimeout(() => btn.textContent = "複製這個頁面的連結", 2200);
});
</script>
</body>
</html>
